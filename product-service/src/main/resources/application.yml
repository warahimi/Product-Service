server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: product-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/product_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.product: INFO
